<!doctype html>

    p { color: #aab5c9; margin: 18px 0 0; }
  </style>
</head>

  <header><svg viewBox="0 0 48 48" role="img" aria-label="播放图标"><rect width="48" height="48" rx="13" fill="#4b6ef5"/><path d="M19 13 36 24 19 35Z" fill="white"/></svg><h1>本地视频</h1></header>

</html>
